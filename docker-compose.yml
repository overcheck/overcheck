services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-overcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overcheck}
      POSTGRES_DB: ${POSTGRES_DB:-overcheck}
    ports:
      - '5432:5432'
    volumes:
      - overcheck_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-overcheck}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  overcheck_postgres_data:
