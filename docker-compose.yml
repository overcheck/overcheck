services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-overcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overcheck}
      POSTGRES_DB: ${POSTGRES_DB:-overcheck}
    ports:
      - '5432:5432'
    volumes:
      - overcheck_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-overcheck} -d ${POSTGRES_DB:-overcheck}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/overcheck/overcheck:${OVERCHECK_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-overcheck}:${POSTGRES_PASSWORD:-overcheck}@postgres:5432/${POSTGRES_DB:-overcheck}
      PORT: 3000
      # The quickstart serves plain HTTP with no TLS in front. A `Secure` session cookie would
      # never be sent back by the browser in that case, breaking login with no visible error.
      # Set this back to true (or unset it) once you put a TLS-terminating proxy in front.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  overcheck_postgres_data:
